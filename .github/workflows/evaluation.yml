name: Evaluation
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  compile:
    name: Compile SOMA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG:-current}" >> "$GITHUB_OUTPUT"

      - name: Compile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/owl/current
          ./mvnw -B -ntp package -f scripts/java/pom.xml
          (cd scripts/java && java -jar target/IsDefinedInAdder-1.0-SNAPSHOT.jar --versionInfo="$VERSION")
          # The tool rewrites the modules in owl/ in place; publish them next to the collapsed files.
          cp --update=none owl/*.owl build/owl/current/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SOMA OWL
          path: build/owl/current/
          if-no-files-found: error

  pitfalls:
    name: OOPS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SOMA OWL
          path: build/owl/current/

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Find pitfalls
        run: |
          mkdir -p build/files
          # SOMA.owl and SOMA-HOME.owl contain all modules imported by SOMA-ALL and SOMA-HOME, without DUL.
          python scripts/oops.py build/files build/owl/current/SOMA.owl build/owl/current/SOMA-HOME.owl

      - name: Generate annotations
        run: python scripts/oops-github.py build/files/oops-*.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: OOPS Results
          path: build/files/oops-*.xml

  consistency:
    name: HermiT
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SOMA OWL
          path: ./build/owl/current

      - name: Download DUL
        run: wget http://www.ease-crc.org/ont/DUL.owl -O ./build/DUL.owl

      - name: HermiT
        uses: ./.github/actions/hermit
        with:
          args: ./build/DUL.owl ./build/SOMA-HOME.owl

      - name: Print HermiT output
        run: cat ./hermit.output
        if: always()

      - name: Evaluate HermiT output
        if: success()
        uses: docker://python:3.7.6-slim
        with:
          args: python ./scripts/hermit_test.py -o ./owl/hermit.html ./hermit.output

  vocabulary:
    name: SOMA Vocabulary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SOMA OWL
          path: build/owl/current/

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/vocab/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-extra-utils
          pip install -r docs/vocab/requirements.txt

      - name: Build
        run: |
          cp docs/vocab/Makefile docs/vocab/SOMA-vocabulary.tex docs/vocab/owl_reader.py .
          make

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SOMA Vocabulary
          path: SOMA-vocabulary.pdf
          if-no-files-found: error

  handbook:
    name: NEEM Handbook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Build
        run: make -f docs/NEEM-handbook/Makefile

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NEEM Handbook
          path: docs/NEEM-handbook/main.pdf
          if-no-files-found: error

  deploy:
    name: Deployment
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [compile, handbook]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages-${{ needs.compile.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SOMA OWL
          path: build/owl/current/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NEEM Handbook
          path: build/files/

      - run: mv build/files/main.pdf build/files/NEEM-Handbook.pdf

      - name: Deploy OWL files
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build/owl/current
          target-folder: owl/${{ needs.compile.outputs.version }}
          clean: false

      - name: Deploy files
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build/files
          target-folder: files/${{ needs.compile.outputs.version }}
          clean: false
