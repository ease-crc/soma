name: Evaluation
on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  compile:
    name: Compile SOMA
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Compile
        run: |
          bash ./mvnw -B -ntp verify -f scripts/java/pom.xml -Dsoma.version=current '-Dtest=!Konclude*'

      - name: Upload reasoner inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SOMA Reasoner Inputs
          path: ./build/ci/work/
          retention-days: 7
          if-no-files-found: error

      - name: Upload processing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SOMA Processing Reports
          path: |
            ./build/ci/reports/
            ./build/ci/manifest.json
          retention-days: 7

      - name: Upload OWL file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SOMA OWL
          path: ./build/ci/dist/owl/
          retention-days: 7
          if-no-files-found: error


  pitfalls:
    name: OOPS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: compile
    outputs:
      technical-status: ${{ steps.oops-tests.outcome == 'success' && steps.oops-run.outcome == 'success' && steps.annotations.outcome == 'success' && steps.upload.outcome == 'success' && 'success' || 'failure' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SOMA OWL
          path: ./build/ci/dist/owl/

      - name: Create report directory
        run: mkdir -p ./build/ci/reports

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup Java for local OOPS
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build pinned OOPS from source
        run: python scripts/install-oops.py

      - name: Test local OOPS and failure handling
        id: oops-tests
        env:
          OOPS_INTEGRATION: '1'
        run: python -m unittest discover -s scripts/tests -v

      - name: Find pitfalls
        id: oops-run
        run: python ./scripts/oops.py build/ci/dist/owl/SOMA-HOME.owl build/ci/reports

      - name: Generate annotations
        id: annotations
        if: always()
        run: python ./scripts/oops-github.py build/ci/reports/oops.json

      - name: Upload pitfalls
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OOPS Results
          path: |
            ./build/ci/reports/oops.json
            ./build/ci/reports/stdout.log
            ./build/ci/reports/stderr.log
            ./build/tools/oops/installation.json
          retention-days: 7

  consistency:
    name: HermiT
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: compile
    outputs:
      technical-status: ${{ steps.adapter.outcome == 'success' && steps.gate-tests.outcome == 'success' && steps.upload.outcome == 'success' && 'success' || 'failure' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SOMA OWL
          path: ./build/ci/dist/owl/

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build OWLAPI adapter and run contract tests
        id: adapter
        run: bash ./mvnw -B -ntp -f scripts/java/pom.xml package '-Dtest=!Konclude*'

      - name: HermiT on covering source and exported roots
        run: >-
          java -cp scripts/java/target/IsDefinedInAdder-1.0-SNAPSHOT.jar main.reasoning.HermitCli
          --suite=. --scope=roots --output=build/ci/reports/hermit --timeout-seconds=600 --memory-mb=2048

      - name: Test quality gate with deliberately broken ontologies
        id: gate-tests
        if: ${{ !cancelled() }}
        env:
          QUALITY_GATE_JAR: scripts/java/target/IsDefinedInAdder-1.0-SNAPSHOT.jar
        run: python3 -m unittest discover -s scripts/tests -p test_quality_gate.py -v

      - name: Upload HermiT results
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HermiT Results
          path: build/ci/reports/
          retention-days: 7

  quality-gate:
    name: Ontology quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [workflow-lint, compile, consistency, pitfalls]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download diagnostic artifacts from this run
        id: diagnostics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build/quality-input
      - name: Evaluate mandatory checks and write CI summary
        if: ${{ always() }}
        env:
          REQUIRED_JOBS: >-
            {"workflow-lint":"${{ needs.workflow-lint.result }}",
             "compile":"${{ needs.compile.result }}",
             "consistency":"${{ needs.consistency.result }}",
             "pitfalls":"${{ needs.pitfalls.result }}",
             "HermiT infrastructure":"${{ needs.consistency.outputs.technical-status }}",
             "OOPS infrastructure":"${{ needs.pitfalls.outputs.technical-status }}",
             "artifact-download":"${{ steps.diagnostics.outcome }}"}
        run: >-
          python scripts/quality_gate.py --artifacts=build/quality-input
          --output=build/quality-gate --jobs="$REQUIRED_JOBS"
      - name: Preserve normalized quality gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ontology Quality Gate
          path: build/quality-gate/
          retention-days: 7
          if-no-files-found: error

